services:
  content-fabric:
    build: .
    image: content-fabric:latest
    container_name: content-fabric
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
